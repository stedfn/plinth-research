name: checks

# Deterministic and offline: no keys, no network beyond installing the pinned
# dependencies. Research runs and Trust Centers are local and never committed,
# so every test builds its runs from generated bytes.
on:
  push:
  pull_request:

jobs:
  compiler-and-skill:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the declared floor (requires-python); 3.13 and 3.14 are what
        # operators run. Canonical bytes come from pydantic's JSON mode, which is
        # pinned exactly, so every version must produce identical digests.
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Editable on purpose: the compiler reads inputs/ and prompts/ from the
      # checkout, so a non-editable install cannot run the catalogue gates.
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      # The two gates the suite cannot stand in for, because they run against
      # the files exactly as committed. `build --check` fails if
      # `inputs/catalogue.json` is not what the pinned markdown compiles to — a
      # hand-edited artifact, a changed parser, or a changed input. `verify`
      # re-reads the source bytes and reconstructs all 63 checks against them,
      # which is what catches a parser that is wrong rather than merely changed.
      #
      # `python -m plinth`, not the `plinth` console script: no assumption about
      # what pip put on PATH, and it exercises the __main__ entry point that the
      # test suite reaches only through `cli.main`.
      - run: python -m plinth catalogue build --check
      - run: python -m plinth catalogue verify
      # The skill's scripts run as standalone files in the field; prove they
      # import and parse arguments that way, not only through the test loader.
      - run: python skills/plinth-trust-center/scripts/check_morphed_html.py --help
      - run: python skills/plinth-trust-center/scripts/prefill_shell.py --help
